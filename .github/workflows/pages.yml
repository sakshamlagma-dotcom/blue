name: Deploy BLUE Search to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "blue-ai-agent_1/blue/client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blue-ai-agent_1/blue/client/package-lock.json
      - name: Install dependencies
        working-directory: blue-ai-agent_1/blue/client
        run: npm ci
      - name: Run search tests
        working-directory: blue-ai-agent_1/blue/client
        run: npm test
      - name: Build static site
        working-directory: blue-ai-agent_1/blue/client
        env:
          VITE_SEARCH_API_BASE: ${{ vars.VITE_SEARCH_API_BASE }}
          VITE_ASSISTANT_API_BASE: ${{ vars.VITE_ASSISTANT_API_BASE }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blue-ai-agent_1/blue/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
